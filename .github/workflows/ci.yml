name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python and cache pip downloads
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.5

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run the five tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Save the test report
        if: ${{ !cancelled() && hashFiles('test-results.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
